openapi: 3.1.0

info:
  title: "MYP Cards - API"
  description: |
    API pública do MYP Cards, o maior portal de cardgames do Brasil.

    **Jogos suportados:** Magic: The Gathering, Yu-Gi-Oh!, Pokémon, One Piece, Lorcana, Flesh & Blood, Digimon, Dragon Ball Super Fusion World, Dragon Ball Super Masters, Gundam, Harry Potter, Lord of the Rings, Battle Scenes, Star Wars: Destiny, Star Wars: Unlimited, Cardfight!! Vanguard, Sorcery: Contested Realm, Riftbound. A lista completa e atual está em `GET /jogos`.

    **Limites:** A paginação é limitada a 50 itens por página.

    **Autenticação:** Nenhum endpoint exige token, mas o token aumenta o limite de requisições. Envie a chave no header `X-Api-Token`. Um token inválido vale como nenhum token. Para obter acesso, faça a solicitação em https://mypcards.com/acesso-api (é preciso ter uma conta no MYP Cards). Depois da aprovação, você mesmo gera a chave no seu painel de acesso à API; ela é exibida uma única vez.

    **Erros:** Todo erro de uma rota que casa responde com o código HTTP correto para o erro e um corpo `{"error": "...", "code": "...", "status": N}`. O `code` é estável e a lista está no schema `Error`. Uma falha inesperada responde 500 com `code` `internal_error`. Uma exceção: em `/{jogo}/edicoes/{edition_id}/precos` e em `/produto/{id_produto}/historico`, um ID que não é número não casa com nenhuma rota e responde uma página HTML 404, sem corpo JSON.

    **Limite de requisições:** 60 por minuto com token e 10 por minuto sem token, contados por IP e por rota. Chamadas de jogos diferentes à mesma rota, como `/yugioh/precos` e `/magic/precos`, dividem o mesmo contador. Toda resposta traz os cabeçalhos `X-Rate-Limit-Limit` e `X-Rate-Limit-Remaining`. Sem token válido, ela traz também `X-Api-Token-Notice`. Ao passar do limite, a resposta é 429.

    **Atribuição:** Todo projeto que usa a API precisa exibir, de forma visível onde os dados aparecem, que eles vêm do MYP Cards, com link para https://mypcards.com. Sem a atribuição, o acesso pode ser pausado.
  version: "1.0.0"
  contact:
    name: "MYP Cards"
    url: "https://mypcards.com"

servers:
  - url: "https://mypcards.com/api/v1"
    description: "Servidor de produção"

security:
  - {}
  - ApiTokenAuth: []

tags:
  - name: "jogos"
    description: "APIs do catálogo de jogos"
  - name: "preço"
    description: "APIs relacionadas a preços de cartas"
  - name: "cartas"
    description: "APIs de busca de cartas"
  - name: "edições"
    description: "APIs do catálogo de edições"
  - name: "produtos"
    description: "APIs gerais sobre produtos"

paths:
  /jogos:
    get:
      operationId: "listarJogos"
      tags:
        - "jogos"
      summary: "Lista os jogos"
      description: |
        Retorna todos os jogos da API em uma única resposta, sem paginação. A ordem é a mesma do MYP Cards.

        O `slug` de cada jogo é o valor do parâmetro `{jogo}` dos demais endpoints.
      responses:
        200:
          description: "Lista de jogos retornada com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JogosResponse"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /{jogo}/precos:
    get:
      operationId: "listarPrecos"
      tags:
        - "preço"
      summary: "Lista cartas com preços"
      description: "Retorna uma lista paginada das cartas de um jogo que têm estoque à venda, segundo as estatísticas do MYP Cards, com informações de preço. Cartas sem estoque não aparecem. A resposta não traz o total de itens: pagine até `cards` vir vazio."
      parameters:
        - in: "path"
          name: "jogo"
          description: "Identificador do jogo (ex: `yugioh`, `pokemon`, `magic`). A lista completa está em `GET /jogos`."
          required: true
          schema:
            $ref: "#/components/schemas/Jogos"
        - in: "query"
          name: "page_number"
          description: "Número da página (começa em 1). Um valor menor que 1 vira 1"
          required: false
          schema:
            type: "integer"
            default: 1
            minimum: 1
        - name: "page_size"
          in: "query"
          description: "Quantidade de itens por página. Valores fora do intervalo são ajustados para o limite mais próximo"
          required: false
          schema:
            type: "integer"
            default: 50
            minimum: 1
            maximum: 50
      responses:
        200:
          description: "Lista de cartas retornada com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrecoResponse"
        400:
          $ref: "#/components/responses/ParametroInvalido"
        404:
          description: "Jogo não encontrado (`code`: `game_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /{jogo}/precos/{codigo}:
    get:
      operationId: "obterPrecoPorCodigo"
      tags:
        - "preço"
      summary: "Obtém carta por código"
      description: "Retorna os dados de uma carta específica com base no código do produto. A carta é retornada mesmo sem estoque; nesse caso os preços vêm `null`."
      parameters:
        - in: "path"
          name: "jogo"
          description: "Identificador do jogo (ex: `yugioh`, `pokemon`, `magic`). A lista completa está em `GET /jogos`."
          required: true
          schema:
            $ref: "#/components/schemas/Jogos"
        - in: "path"
          name: "codigo"
          description: |
            Código da carta no MYP Cards, codificado em Base64.
            Exemplo: o código `LOB-001` deve ser enviado como `TE9CLTAwMQ==`
          required: true
          schema:
            type: "string"
            example: "TE9CLTAwMQ=="
      responses:
        200:
          description: "Carta encontrada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Produto"
        400:
          $ref: "#/components/responses/ParametroInvalido"
        404:
          description: "Jogo ou carta não encontrado (`code`: `game_not_found` ou `card_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /{jogo}/carta/{nome}:
    get:
      operationId: "buscarCartaPorNome"
      tags:
        - "cartas"
      summary: "Busca cartas por nome"
      description: "Retorna uma lista de cartas que correspondem exatamente ao nome informado. As cartas são retornadas mesmo sem estoque; nesse caso os preços vêm `null`."
      parameters:
        - in: "path"
          name: "jogo"
          description: "Identificador do jogo (ex: `yugioh`, `pokemon`, `magic`). A lista completa está em `GET /jogos`."
          required: true
          schema:
            $ref: "#/components/schemas/Jogos"
        - name: "nome"
          in: "path"
          description: "Nome exato da carta em inglês ou português"
          required: true
          schema:
            type: string
            example: "Dark Magician"
      responses:
        200:
          description: "Busca realizada com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartaResponse"
        404:
          description: "Jogo não encontrado (`code`: `game_not_found`). Uma busca sem resultado responde 200 com `cards` vazio"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /{jogo}/edicoes:
    get:
      operationId: "listarEdicoes"
      tags:
        - "edições"
      summary: "Lista as edições de um jogo"
      description: |
        Retorna **todas** as edições de um jogo em uma única resposta, sem paginação,
        ordenadas da mais recente para a mais antiga (edições sem data de lançamento vêm por último).

        Edições orientais (impressões asiáticas) não são retornadas.
      parameters:
        - in: "path"
          name: "jogo"
          description: "Identificador do jogo (ex: `yugioh`, `pokemon`, `magic`). A lista completa está em `GET /jogos`."
          required: true
          schema:
            $ref: "#/components/schemas/Jogos"
      responses:
        200:
          description: "Lista de edições retornada com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdicoesResponse"
        404:
          description: "Jogo não encontrado (`code`: `game_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /{jogo}/edicoes/{edition_id}/precos:
    get:
      operationId: "obterPrecoDaEdicao"
      tags:
        - "edições"
      summary: "Preço da semana mais recente de uma edição"
      description: |
        Retorna o valor do set de uma edição na semana mais recente fechada, a que termina no último domingo, e a variação em relação à semana anterior. O endpoint não aceita parâmetros de filtro. A série ao longo do tempo está na página de preço da edição, no site.

        O campo `week` é o domingo que fecha a semana a que os valores se referem. Hoje, domingo incluído, ele é o último domingo já passado. O preço de uma semana sem novidade se mantém até mudar.

        O valor do set e a variação são valores exatos, porque preço é público. Nenhuma quantidade de estoque, de cópias à venda ou de pedidos é retornada.

        Só as edições que `GET /{jogo}/edicoes` lista podem ser consultadas.
      parameters:
        - in: "path"
          name: "jogo"
          description: "Identificador do jogo (ex: `yugioh`, `pokemon`, `magic`). A lista completa está em `GET /jogos`."
          required: true
          schema:
            $ref: "#/components/schemas/Jogos"
        - in: "path"
          name: "edition_id"
          description: "ID da edição, o mesmo `edition_id` retornado por `GET /{jogo}/edicoes`"
          required: true
          schema:
            type: integer
            example: 1046
      responses:
        200:
          description: "Preço da semana mais recente da edição"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdicaoPrecosResponse"
        404:
          description: "Jogo ou edição não encontrado (`code`: `game_not_found` ou `edition_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /produto/{id_produto}:
    get:
      operationId: "obterProdutoPorId"
      tags:
        - "produtos"
      summary: "Obtém produto por ID"
      description: "Retorna os dados de um produto de jogo com base no ID interno do MYP Cards, no mesmo formato da lista de preços. O produto é retornado mesmo sem estoque; nesse caso os preços vêm `null`. Um produto que não é de um jogo responde 404."
      parameters:
        - in: "path"
          name: "id_produto"
          description: "ID interno do produto no MYP Cards"
          required: true
          schema:
            type: integer
            example: 12345
      responses:
        200:
          description: "Produto encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Produto"
        400:
          $ref: "#/components/responses/ParametroInvalido"
        404:
          description: "Produto não encontrado, ou que não é de um jogo (`code`: `product_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /produto/{id_produto}/historico:
    get:
      operationId: "obterHistoricoDoProduto"
      tags:
        - "preço"
      summary: "Histórico de preço de uma carta"
      description: |
        Retorna a série diária dos últimos 90 dias do preço mínimo e da mediana de uma carta avulsa, na versão padrão do MYP Cards: a mais vendida nos últimos 30 dias ou, sem venda, a com mais unidades à venda, sem cartas graduadas. A versão pode ser foil. O endpoint não aceita parâmetros. Outras versões e janelas estão na página de preço da carta, no site.

        A resposta diz qual é a versão (`version`). Dias sem mudança repetem o valor do dia anterior. A série tem até 91 pontos: os 90 dias anteriores e hoje.

        Só cartas avulsas respondem. Outro tipo de produto responde 404.
      parameters:
        - in: "path"
          name: "id_produto"
          description: "ID interno do produto no MYP Cards (`internal_code`)"
          required: true
          schema:
            type: integer
            example: 12345
      responses:
        200:
          description: "Histórico de preço da carta"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricoResponse"
        404:
          description: "Produto não encontrado, ou que não é carta avulsa (`code`: `product_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

components:
  securitySchemes:
    ApiTokenAuth:
      type: apiKey
      in: header
      name: X-Api-Token
      description: "Chave gerada pelo próprio titular no painel de acesso à API, depois que a solicitação em https://mypcards.com/acesso-api é aprovada. Ela é exibida uma única vez."

  responses:
    ParametroInvalido:
      description: "Parâmetro inválido (`code`: `invalid_parameter`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LimiteExcedido:
      description: "Limite de requisições excedido (`code`: `rate_limited`)"
      headers:
        X-Rate-Limit-Limit:
          description: "Máximo de requisições por janela de 60 segundos. Toda resposta traz este cabeçalho"
          schema:
            type: integer
        X-Rate-Limit-Remaining:
          description: "Requisições que restam na janela. É 0 quando o limite estoura"
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Jogos:
      type: string
      description: "Identificador do jogo de cartas. A lista completa e atual está em `GET /jogos`"
      enum:
        - yugioh
        - pokemon
        - magic
        - digimon
        - onepiece
        - battlescenes
        - dbsfusion
        - dbsmasters
        - fab
        - grandarchive
        - gundam
        - hp
        - lorcana
        - lotr
        - riftbound
        - sorcery
        - swdestiny
        - vanguard
        - swunlimited
        - unionarena
        - weissschwarz
        - warlord
        - cyberpunk
        - copadomundo2026

    JogosResponse:
      type: object
      description: "Resposta com a lista de jogos"
      properties:
        total:
          type: integer
          description: "Quantidade de jogos retornados"
          example: 3
        games:
          type: array
          description: "Lista de jogos"
          items:
            $ref: "#/components/schemas/Jogo"

    Jogo:
      type: object
      description: "Dados de um jogo"
      properties:
        slug:
          $ref: "#/components/schemas/Jogos"
        name:
          type: string
          description: "Nome do jogo"
          example: "Yu-Gi-Oh!"
      example:
        slug: "yugioh"
        name: "Yu-Gi-Oh!"

    PrecoResponse:
      type: object
      description: "Resposta paginada com lista de cartas"
      properties:
        page_number:
          type: integer
          description: "Número da página atual"
          example: 1
        page_size:
          type: integer
          description: "Quantidade de itens por página"
          example: 50
        cards:
          type: array
          description: "Lista de cartas"
          items:
            $ref: "#/components/schemas/Produto"

    CartaResponse:
      type: object
      description: "Resposta com lista de cartas encontradas"
      properties:
        cards:
          type: array
          description: "Lista de cartas que correspondem à busca"
          items:
            $ref: "#/components/schemas/Produto"

    EdicoesResponse:
      type: object
      description: "Resposta com o catálogo completo de edições do jogo"
      properties:
        total:
          type: integer
          description: "Quantidade de edições retornadas"
          example: 475
        editions:
          type: array
          description: "Lista de edições, da mais recente para a mais antiga"
          items:
            $ref: "#/components/schemas/Edicao"

    Edicao:
      type: object
      description: "Dados de uma edição"
      properties:
        edition_id:
          type: integer
          description: "ID interno da edição no MYP Cards"
          example: 1046
        id_marca:
          type: integer
          description: "ID do jogo/marca (1=Magic, 2=Pokémon, 3=Yu-Gi-Oh!, etc.)"
          example: 1
        edition_code:
          type: [string, "null"]
          description: "Sigla da edição — o mesmo valor que aparece em `edition_code` nas cartas"
          example: "DOM"
        edition_pt:
          type: [string, "null"]
          description: "Nome da edição em português"
          example: "Dominária"
        edition_en:
          type: [string, "null"]
          description: "Nome da edição em inglês"
          example: "Dominaria"
        slug_pt:
          type: [string, "null"]
          description: "Slug do nome em português (para URLs)"
          example: "dominaria"
        slug_en:
          type: [string, "null"]
          description: "Slug do nome em inglês (para URLs)"
          example: "dominaria"
        release_date:
          type: [string, "null"]
          format: date
          description: "Data de lançamento no formato ISO (YYYY-MM-DD)"
          example: "2018-04-27"
        total_cards:
          type: [integer, "null"]
          description: "Quantidade de cartas da edição, quando conhecida"
          example: 298
        link:
          type: [string, "null"]
          description: "URL da página da edição no MYP Cards"
          example: "https://mypcards.com/magic/dominaria"

    Produto:
      type: object
      description: "Dados completos de uma carta/produto. Os preços vêm das estatísticas do MYP Cards, que a API guarda em cache por 5 minutos; o atraso da fila de estatísticas não é conhecido"
      properties:
        internal_code:
          type: integer
          description: "ID interno do produto no MYP Cards"
          example: 12345
        card_code:
          type: string
          description: "Código da carta (ex: LOB-001)"
          example: "LOB-001"
        id_marca:
          type: integer
          description: "ID do jogo/marca (1=Magic, 2=Pokémon, 3=Yu-Gi-Oh!, etc.)"
          example: 3
        tcg_productId:
          type: [integer, "null"]
          description: "ID do produto no TCGPlayer (quando disponível)"
          example: 86354
        name_pt:
          type: [string, "null"]
          description: "Nome da carta em português"
          example: "Mago Negro"
        name_en:
          type: [string, "null"]
          description: "Nome da carta em inglês"
          example: "Dark Magician"
        slug_pt:
          type: [string, "null"]
          description: "Slug do nome em português (para URLs)"
          example: "mago-negro"
        slug_en:
          type: [string, "null"]
          description: "Slug do nome em inglês (para URLs)"
          example: "dark-magician"
        edition_pt:
          type: [string, "null"]
          description: "Nome da edição em português"
          example: "Lendas do Duelo Azul"
        edition_en:
          type: [string, "null"]
          description: "Nome da edição em inglês"
          example: "Legend of Blue Eyes White Dragon"
        edition_code:
          type: [string, "null"]
          description: "Código/sigla da edição"
          example: "LOB"
        deck_labels:
          type: array
          items:
            type: string
          description: |
            Todas as grafias que o importador de decks do MYP Cards aceita para **esta impressão exata**, sem repetições, ordenadas da mais específica para a menos.

            Use a primeira ao montar uma decklist para colar: ela resolve um único produto, enquanto o nome puro da carta costuma casar com várias impressões e obriga quem está colando a desempatar linha por linha.

            O formato varia por jogo e por edição — algumas grafias trazem o número com o total do set, outras só o numerador, e a mesma carta pode aparecer em português e em inglês. Não monte a string por conta própria a partir de `name_*` e `edition_code`: um número em formato diferente do cadastrado não é encontrado pelo importador. Use uma destas.

            Lista vazia quando o produto ainda não tem grafias cadastradas.
          example:
            - "Dark Magician [LOB] 1"
            - "Mago Negro [LOB] 1"
            - "Dark Magician LOB (001/126)"
        min_price:
          type: [string, "null"]
          description: "Menor preço entre as cartas avulsas (não graduadas) à venda em português, inglês ou português-inglês (em BRL). É `null` quando não há carta avulsa à venda nesses idiomas"
          example: "15.00"
        avg_price:
          type: [string, "null"]
          description: "Preço médio das mesmas cartas de `min_price`, ponderado pela quantidade à venda (em BRL)"
          example: "25.50"
        img_pt:
          type: [string, "null"]
          description: "URL da imagem da carta em português. É `null` quando o produto não tem imagem"
          example: "https://img.mypcards.com/produtos/12345_pt.jpg"
        img_en:
          type: [string, "null"]
          description: "URL da imagem da carta em inglês. É `null` quando o produto não tem imagem"
          example: "https://img.mypcards.com/produtos/12345_en.jpg"
        link:
          type: string
          description: "URL da página do produto no MYP Cards"
          example: "https://mypcards.com/yugioh/produto/12345/dark-magician"

    EdicaoPrecosResponse:
      type: object
      description: "Preço da semana mais recente de uma edição"
      properties:
        edition_id:
          type: integer
          description: "ID interno da edição no MYP Cards"
          example: 1046
        id_marca:
          type: integer
          description: "ID do jogo/marca"
          example: 1
        edition_code:
          type: [string, "null"]
          example: "DOM"
        edition_pt:
          type: [string, "null"]
          example: "Dominária"
        edition_en:
          type: [string, "null"]
          example: "Dominaria"
        currency:
          type: string
          description: "Moeda dos valores"
          example: "BRL"
        week:
          type: [string, "null"]
          format: date
          description: "Domingo que fecha a semana a que os valores se referem: o último domingo já passado. É `null` quando a edição não tem histórico de preço"
          example: "2026-10-25"
        total_cards:
          type: integer
          description: "Quantidade de cartas avulsas ativas da edição no catálogo. Pode diferir de `total_cards` em `GET /{jogo}/edicoes`, que é o total cadastrado da edição"
          example: 298
        set_value:
          type: [number, "null"]
          description: "Valor do set na semana `week` (em BRL): a soma, por carta, da menor mediana de preço da versão NM sem foil. Só entram cartas avulsas nos idiomas principais da edição (português, inglês ou o idioma exclusivo dela). É `null` quando a semana não tem preço"
          example: 1840.5
        change_week_pct:
          type: [number, "null"]
          description: "Variação do valor do set em relação à semana anterior, em percentual. É `null` quando uma das duas semanas não tem valor"
          example: -1.2

    VersaoDePreco:
      type: object
      description: "A versão da carta a que a série de preço se refere"
      properties:
        foil_id:
          type: integer
          example: 1
        foil_name:
          type: string
          example: "Normal"
        condition:
          type: string
          enum: [NM, SP, MP, HP, DM]
        language_id:
          type: integer
          example: 2
        language_name:
          type: string
          example: "English"

    PontoDeHistorico:
      type: object
      description: "Um dia da série de preço"
      properties:
        date:
          type: string
          format: date
          example: "2026-10-20"
        min_price:
          type: [number, "null"]
          description: "Menor preço do dia (em BRL)"
        median:
          type: [number, "null"]
          description: "Mediana dos preços à venda no dia (em BRL)"

    HistoricoResponse:
      type: object
      description: "Série diária de preço de uma carta"
      properties:
        internal_code:
          type: integer
          example: 12345
        currency:
          type: string
          example: "BRL"
        days:
          type: integer
          description: "Janela da série, em dias. É sempre 90"
          example: 90
        version:
          oneOf:
            - $ref: "#/components/schemas/VersaoDePreco"
            - type: "null"
          description: "A versão da série. É `null` quando a carta não tem histórico de uma versão avulsa, e `points` vem vazio"
        points:
          type: array
          description: "Um ponto por dia, do mais antigo para o mais recente"
          items:
            $ref: "#/components/schemas/PontoDeHistorico"

    Error:
      type: object
      description: "Resposta de erro. O campo `error` é a mensagem em inglês; use `code` no seu código, que é estável"
      required: [error, code, status]
      properties:
        error:
          type: string
          description: "Mensagem de erro"
          example: "card_code not found."
        code:
          type: string
          description: "Código estável do erro"
          enum:
            - invalid_parameter
            - game_not_found
            - card_not_found
            - product_not_found
            - edition_not_found
            - not_found
            - rate_limited
            - internal_error
            - http_error
          example: "card_not_found"
        status:
          type: integer
          description: "Código HTTP da resposta"
          example: 404
