openapi: 3.1.0

info:
  title: "MYP Cards - API"
  description: |
    API pública do MYP Cards, o maior portal de cardgames do Brasil.

    **Jogos suportados:** Magic: The Gathering, Yu-Gi-Oh!, Pokémon, One Piece, Lorcana, Flesh & Blood, Digimon, Dragon Ball Super Fusion World, Dragon Ball Super Masters, Gundam, Harry Potter, Lord of the Rings, Battle Scenes, Star Wars: Destiny, Star Wars: Unlimited, Cardfight!! Vanguard, Sorcery: Contested Realm, Riftbound. A lista completa e atual está em `GET /jogos`.

    **Limites:** A paginação é limitada a 50 itens por página.

    **Autenticação:** Nenhum endpoint exige token, mas o token aumenta o limite de requisições. Envie a chave no header `X-Api-Token`. Um token inválido vale como nenhum token. Para obter acesso, faça a solicitação em https://mypcards.com/acesso-api (é preciso ter uma conta no MYP Cards). Depois da aprovação, você mesmo gera a chave no seu painel de acesso à API; ela é exibida uma única vez.

    **Erros:** Todo erro das rotas documentadas responde com o código HTTP correto para o erro e um corpo `{"error": "...", "code": "...", "status": N}`. O `code` é estável e a lista está no schema `Error`. Uma falha inesperada responde 500 com `code` `internal_error`.

    **Limite de requisições:** 60 por minuto com token e 10 por minuto sem token, contados por IP e por endpoint. Toda resposta traz os cabeçalhos `X-Rate-Limit-Limit` e `X-Rate-Limit-Remaining`. Sem token válido, ela traz também `X-Api-Token-Notice`. Ao passar do limite, a resposta é 429.

    **Atribuição:** Todo projeto que usa a API precisa exibir, de forma visível onde os dados aparecem, que eles vêm do MYP Cards, com link para https://mypcards.com. Sem a atribuição, o acesso pode ser pausado.
  version: "1.0.0"
  contact:
    name: "MYP Cards"
    url: "https://mypcards.com"

servers:
  - url: "https://mypcards.com/api/v1"
    description: "Servidor de produção"

security:
  - {}
  - ApiTokenAuth: []

tags:
  - name: "jogos"
    description: "APIs do catálogo de jogos"
  - name: "preço"
    description: "APIs relacionadas a preços de cartas"
  - name: "cartas"
    description: "APIs de busca de cartas"
  - name: "edições"
    description: "APIs do catálogo de edições"
  - name: "produtos"
    description: "APIs gerais sobre produtos"

paths:
  /jogos:
    get:
      operationId: "listarJogos"
      tags:
        - "jogos"
      summary: "Lista os jogos"
      description: |
        Retorna todos os jogos da API em uma única resposta, sem paginação. A ordem é a mesma do MYP Cards.

        O `slug` de cada jogo é o valor do parâmetro `{jogo}` dos demais endpoints.
      responses:
        200:
          description: "Lista de jogos retornada com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JogosResponse"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /{jogo}/precos:
    get:
      operationId: "listarPrecos"
      tags:
        - "preço"
      summary: "Lista cartas com preços"
      description: "Retorna uma lista paginada de cartas de um jogo específico com informações de preço."
      parameters:
        - in: "path"
          name: "jogo"
          description: "Identificador do jogo (ex: `yugioh`, `pokemon`, `magic`). A lista completa está em `GET /jogos`."
          required: true
          schema:
            $ref: "#/components/schemas/Jogos"
        - in: "query"
          name: "page_number"
          description: "Número da página (começa em 1). Um valor menor que 1 vira 1"
          required: false
          schema:
            type: "integer"
            default: 1
            minimum: 1
        - name: "page_size"
          in: "query"
          description: "Quantidade de itens por página. Valores fora do intervalo são ajustados para o limite mais próximo"
          required: false
          schema:
            type: "integer"
            default: 50
            minimum: 1
            maximum: 50
      responses:
        200:
          description: "Lista de cartas retornada com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrecoResponse"
        400:
          $ref: "#/components/responses/ParametroInvalido"
        404:
          description: "Jogo não encontrado (`code`: `game_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /{jogo}/precos/{codigo}:
    get:
      operationId: "obterPrecoPorCodigo"
      tags:
        - "preço"
      summary: "Obtém carta por código"
      description: "Retorna os dados de uma carta específica com base no código do produto."
      parameters:
        - in: "path"
          name: "jogo"
          description: "Identificador do jogo (ex: `yugioh`, `pokemon`, `magic`). A lista completa está em `GET /jogos`."
          required: true
          schema:
            $ref: "#/components/schemas/Jogos"
        - in: "path"
          name: "codigo"
          description: |
            Código da carta no MYP Cards, codificado em Base64.
            Exemplo: o código `LOB-001` deve ser enviado como `TE9CLTAwMQ==`
          required: true
          schema:
            type: "string"
            example: "TE9CLTAwMQ=="
      responses:
        200:
          description: "Carta encontrada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Produto"
        400:
          $ref: "#/components/responses/ParametroInvalido"
        404:
          description: "Jogo ou carta não encontrado (`code`: `game_not_found` ou `card_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /{jogo}/carta/{nome}:
    get:
      operationId: "buscarCartaPorNome"
      tags:
        - "cartas"
      summary: "Busca cartas por nome"
      description: "Retorna uma lista de cartas que correspondem exatamente ao nome informado."
      parameters:
        - in: "path"
          name: "jogo"
          description: "Identificador do jogo (ex: `yugioh`, `pokemon`, `magic`). A lista completa está em `GET /jogos`."
          required: true
          schema:
            $ref: "#/components/schemas/Jogos"
        - name: "nome"
          in: "path"
          description: "Nome exato da carta em inglês ou português"
          required: true
          schema:
            type: string
            example: "Dark Magician"
      responses:
        200:
          description: "Busca realizada com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartaResponse"
        404:
          description: "Jogo não encontrado (`code`: `game_not_found`). Uma busca sem resultado responde 200 com `cards` vazio"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /{jogo}/edicoes:
    get:
      operationId: "listarEdicoes"
      tags:
        - "edições"
      summary: "Lista as edições de um jogo"
      description: |
        Retorna **todas** as edições de um jogo em uma única resposta, sem paginação,
        ordenadas da mais recente para a mais antiga (edições sem data de lançamento vêm por último).

        Edições orientais (impressões asiáticas) não são retornadas.
      parameters:
        - in: "path"
          name: "jogo"
          description: "Identificador do jogo (ex: `yugioh`, `pokemon`, `magic`). A lista completa está em `GET /jogos`."
          required: true
          schema:
            $ref: "#/components/schemas/Jogos"
      responses:
        200:
          description: "Lista de edições retornada com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdicoesResponse"
        404:
          description: "Jogo não encontrado (`code`: `game_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /{jogo}/edicoes/{edition_id}/precos:
    get:
      operationId: "obterPrecosDaEdicao"
      tags:
        - "edições"
      summary: "Preço de uma edição ao longo do tempo"
      description: |
        Retorna o valor do set e a quantidade de cartas com preço, semana a semana, para uma edição. É a mesma série da página de preço da edição no site.

        O valor do set e as variações em percentual são valores exatos. A quantidade de cartas com preço nunca sai como número. Cada semana traz o índice da faixa (`cards_with_price_range`), e `ranges` diz o intervalo de cartas de cada índice. Com o filtro `rarity[]`, o índice vem `null` em todas as semanas, porque junto com `total_cards` ele revelaria a quantidade exata. Estoque, cópias à venda e pedidos não são retornados.

        Só as edições que `GET /{jogo}/edicoes` lista podem ser consultadas.
      parameters:
        - in: "path"
          name: "jogo"
          description: "Identificador do jogo (ex: `yugioh`, `pokemon`, `magic`). A lista completa está em `GET /jogos`."
          required: true
          schema:
            $ref: "#/components/schemas/Jogos"
        - in: "path"
          name: "edition_id"
          description: "ID da edição, o mesmo `edition_id` retornado por `GET /{jogo}/edicoes`"
          required: true
          schema:
            type: integer
            example: 1046
        - in: "query"
          name: "days"
          description: "Janela da série, em dias. `0` retorna a série inteira, que começa em 18/01/2026 ou na data de lançamento da edição, a que for mais recente"
          required: false
          schema:
            type: integer
            enum: [90, 180, 365, 0]
            default: 90
        - in: "query"
          name: "rarity[]"
          description: "IDs de raridade para filtrar as cartas, os mesmos de `available_rarities`. Repita o parâmetro para mais de uma raridade, até 5. Um ID que não é de `available_rarities` gera 400"
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 5
            items:
              type: integer
      responses:
        200:
          description: "Série de preço da edição"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdicaoPrecosResponse"
        400:
          $ref: "#/components/responses/ParametroInvalido"
        404:
          description: "Jogo ou edição não encontrado (`code`: `game_not_found` ou `edition_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /produto/{id_produto}:
    get:
      operationId: "obterProdutoPorId"
      tags:
        - "produtos"
      summary: "Obtém produto por ID"
      description: "Retorna os dados de um produto específico com base no ID interno do MYP Cards."
      parameters:
        - in: "path"
          name: "id_produto"
          description: "ID interno do produto no MYP Cards"
          required: true
          schema:
            type: integer
            example: 12345
      responses:
        200:
          description: "Produto encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoSimples"
        400:
          $ref: "#/components/responses/ParametroInvalido"
        404:
          description: "Produto não encontrado (`code`: `product_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /produto/{id_produto}/historico:
    get:
      operationId: "obterHistoricoDoProduto"
      tags:
        - "preço"
      summary: "Histórico de preço de um produto"
      description: |
        Retorna a série diária de preço de **uma versão** de um produto (foil, qualidade, idioma e, nas cartas graduadas, graduadora e nota). Dias sem mudança repetem o valor do dia anterior.

        Sem parâmetros de versão, a resposta usa a versão avulsa mais vendida nos últimos 30 dias. Com parâmetros de versão, os que você omite valem para qualquer valor, menos `grader`: sem ele, só as cartas avulsas entram. Se mais de uma versão servir, a resposta usa a que tem mais dias de histórico. A versão precisa existir, senão a resposta é 404 `version_not_found`, sem trocar por outra. Para uma carta graduada, envie `grader` e `grade` juntos. `versions` lista todas as versões que têm histórico, graduadas incluídas.

        Os preços são exatos. A quantidade à venda ao longo do tempo nunca sai como número. Cada dia traz o índice da faixa (`available_quantity_range`), e `quantity_ranges` diz o intervalo de cada índice. Os índices mostram só a faixa da quantidade, não a quantidade. A quantidade vendida não é retornada.

        A série começa no dia mais recente entre hoje menos `days` e o primeiro dia com dado, então pode ter menos dias que `days`.
      parameters:
        - in: "path"
          name: "id_produto"
          description: "ID interno do produto no MYP Cards (`internal_code`)"
          required: true
          schema:
            type: integer
            example: 12345
        - in: "query"
          name: "days"
          description: "Janela da série, em dias"
          required: false
          schema:
            type: integer
            enum: [30, 90, 180, 365]
            default: 90
        - in: "query"
          name: "foil"
          description: "ID do foil da versão (`foil_id` em `versions`)"
          required: false
          schema:
            type: integer
            maximum: 999999999
        - in: "query"
          name: "condition"
          description: "Qualidade da versão"
          required: false
          schema:
            type: string
            enum: [NM, SP, MP, HP, DM]
        - in: "query"
          name: "language"
          description: "ID do idioma da versão (`language_id` em `versions`)"
          required: false
          schema:
            type: integer
            maximum: 999999999
        - in: "query"
          name: "grader"
          description: "ID da graduadora, para uma carta graduada"
          required: false
          schema:
            type: integer
            maximum: 999999999
        - in: "query"
          name: "grade"
          description: "Nota da carta graduada, com no máximo uma casa decimal, por exemplo `9.5` ou `10`. Exige `grader`"
          required: false
          schema:
            type: string
            pattern: '^\d{1,2}(\.\d0?)?$'
            example: "9.5"
      responses:
        200:
          description: "Histórico de preço da versão"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricoResponse"
        400:
          $ref: "#/components/responses/ParametroInvalido"
        404:
          description: "Produto ou versão não encontrado (`code`: `product_not_found` ou `version_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

  /produto/aleatorio:
    get:
      operationId: "obterProdutoAleatorio"
      tags:
        - "produtos"
      summary: "Obtém produto aleatório"
      description: "Retorna um produto aleatório disponível para venda no marketplace."
      responses:
        200:
          description: "Produto retornado com sucesso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoSimples"
        404:
          description: "Nenhum produto disponível (`code`: `no_product_available`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          $ref: "#/components/responses/LimiteExcedido"

components:
  securitySchemes:
    ApiTokenAuth:
      type: apiKey
      in: header
      name: X-Api-Token
      description: "Chave gerada pelo próprio titular no painel de acesso à API, depois que a solicitação em https://mypcards.com/acesso-api é aprovada. Ela é exibida uma única vez."

  responses:
    ParametroInvalido:
      description: "Parâmetro inválido (`code`: `invalid_parameter`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LimiteExcedido:
      description: "Limite de requisições excedido (`code`: `rate_limited`)"
      headers:
        X-Rate-Limit-Limit:
          description: "Máximo de requisições por janela de 60 segundos. Toda resposta traz este cabeçalho"
          schema:
            type: integer
        X-Rate-Limit-Remaining:
          description: "Requisições que restam na janela. É 0 quando o limite estoura"
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Jogos:
      type: string
      description: "Identificador do jogo de cartas"
      enum:
        - yugioh
        - pokemon
        - magic
        - digimon
        - onepiece
        - battlescenes
        - dbsfusion
        - dbsmasters
        - fab
        - grandarchive
        - gundam
        - hp
        - lorcana
        - lotr
        - riftbound
        - sorcery
        - swdestiny
        - vanguard
        - swunlimited
        - unionarena
        - weissschwarz
        - warlord
        - cyberpunk

    JogosResponse:
      type: object
      description: "Resposta com a lista de jogos"
      properties:
        total:
          type: integer
          description: "Quantidade de jogos retornados"
          example: 3
        games:
          type: array
          description: "Lista de jogos"
          items:
            $ref: "#/components/schemas/Jogo"

    Jogo:
      type: object
      description: "Dados de um jogo"
      properties:
        slug:
          $ref: "#/components/schemas/Jogos"
        name:
          type: string
          description: "Nome do jogo"
          example: "Yu-Gi-Oh!"
      example:
        slug: "yugioh"
        name: "Yu-Gi-Oh!"

    PrecoResponse:
      type: object
      description: "Resposta paginada com lista de cartas"
      properties:
        page_number:
          type: integer
          description: "Número da página atual"
          example: 1
        page_size:
          type: integer
          description: "Quantidade de itens por página"
          example: 50
        total_items:
          type: integer
          description: "Quantidade de produtos do jogo no catálogo. Não é quantidade em estoque"
          example: 41307
        cards:
          type: array
          description: "Lista de cartas"
          items:
            $ref: "#/components/schemas/Produto"

    CartaResponse:
      type: object
      description: "Resposta com lista de cartas encontradas"
      properties:
        cards:
          type: array
          description: "Lista de cartas que correspondem à busca"
          items:
            $ref: "#/components/schemas/Produto"

    EdicoesResponse:
      type: object
      description: "Resposta com o catálogo completo de edições do jogo"
      properties:
        total:
          type: integer
          description: "Quantidade de edições retornadas"
          example: 475
        editions:
          type: array
          description: "Lista de edições, da mais recente para a mais antiga"
          items:
            $ref: "#/components/schemas/Edicao"

    Edicao:
      type: object
      description: "Dados de uma edição"
      properties:
        edition_id:
          type: integer
          description: "ID interno da edição no MYP Cards"
          example: 1046
        id_marca:
          type: integer
          description: "ID do jogo/marca (1=Magic, 2=Pokémon, 3=Yu-Gi-Oh!, etc.)"
          example: 1
        edition_code:
          type: [string, "null"]
          description: "Sigla da edição — o mesmo valor que aparece em `edition_code` nas cartas"
          example: "DOM"
        edition_pt:
          type: [string, "null"]
          description: "Nome da edição em português"
          example: "Dominária"
        edition_en:
          type: [string, "null"]
          description: "Nome da edição em inglês"
          example: "Dominaria"
        slug_pt:
          type: [string, "null"]
          description: "Slug do nome em português (para URLs)"
          example: "dominaria"
        slug_en:
          type: [string, "null"]
          description: "Slug do nome em inglês (para URLs)"
          example: "dominaria"
        release_date:
          type: [string, "null"]
          format: date
          description: "Data de lançamento no formato ISO (YYYY-MM-DD)"
          example: "2018-04-27"
        total_cards:
          type: [integer, "null"]
          description: "Quantidade de cartas da edição, quando conhecida"
          example: 298
        link:
          type: [string, "null"]
          description: "URL da página da edição no MYP Cards"
          example: "https://mypcards.com/magic/dominaria"

    Produto:
      type: object
      description: "Dados completos de uma carta/produto. Preços e quantidades vêm das estatísticas do MYP Cards, que a API guarda em cache por 5 minutos; o atraso da fila de estatísticas não é conhecido"
      properties:
        internal_code:
          type: integer
          description: "ID interno do produto no MYP Cards"
          example: 12345
        card_code:
          type: string
          description: "Código da carta (ex: LOB-001)"
          example: "LOB-001"
        id_marca:
          type: integer
          description: "ID do jogo/marca (0=Yu-Gi-Oh!, 1=Magic, 2=Pokémon, etc.)"
          example: 0
        tcg_productId:
          type: [integer, "null"]
          description: "ID do produto no TCGPlayer (quando disponível)"
          example: 86354
        name_pt:
          type: [string, "null"]
          description: "Nome da carta em português"
          example: "Mago Negro"
        name_en:
          type: [string, "null"]
          description: "Nome da carta em inglês"
          example: "Dark Magician"
        slug_pt:
          type: [string, "null"]
          description: "Slug do nome em português (para URLs)"
          example: "mago-negro"
        slug_en:
          type: [string, "null"]
          description: "Slug do nome em inglês (para URLs)"
          example: "dark-magician"
        edition_pt:
          type: [string, "null"]
          description: "Nome da edição em português"
          example: "Lendas do Duelo Azul"
        edition_en:
          type: [string, "null"]
          description: "Nome da edição em inglês"
          example: "Legend of Blue Eyes White Dragon"
        edition_code:
          type: string
          description: "Código/sigla da edição"
          example: "LOB"
        deck_labels:
          type: array
          items:
            type: string
          description: |
            Todas as grafias que o importador de decks do MYP Cards aceita para **esta impressão exata**, sem repetições, ordenadas da mais específica para a menos.

            Use a primeira ao montar uma decklist para colar: ela resolve um único produto, enquanto o nome puro da carta costuma casar com várias impressões e obriga quem está colando a desempatar linha por linha.

            O formato varia por jogo e por edição — algumas grafias trazem o número com o total do set, outras só o numerador, e a mesma carta pode aparecer em português e em inglês. Não monte a string por conta própria a partir de `name_*` e `edition_code`: um número em formato diferente do cadastrado não é encontrado pelo importador. Use uma destas.

            Lista vazia quando o produto ainda não tem grafias cadastradas.
          example:
            - "Dark Magician [LOB] 1"
            - "Mago Negro [LOB] 1"
            - "Dark Magician LOB (001/126)"
        min_price:
          type: [string, "null"]
          description: "Menor preço entre as cartas avulsas (não graduadas) à venda em português, inglês ou português-inglês (em BRL)"
          example: "15.00"
        avg_price:
          type: [string, "null"]
          description: "Preço médio das mesmas cartas de `min_price`, ponderado pela quantidade à venda (em BRL)"
          example: "25.50"
        max_price:
          type: [string, "null"]
          description: "Maior preço entre as mesmas cartas de `min_price` (em BRL)"
          example: "45.00"
        tcg_price:
          type: [string, "null"]
          description: "Preço de mercado da versão comum no TCGPlayer (em USD). Quando ele não existe, usa o preço do foil"
          example: "5.99"
        available_quantity:
          type: [integer, "null"]
          description: "Quantidade à venda das mesmas cartas de `min_price`. Cartas graduadas e outros idiomas não entram, então uma carta vendida só nesses casos devolve 0 e preços nulos"
          example: 23
        img_pt:
          type: [string, "null"]
          description: "URL da imagem da carta em português. É `null` quando o produto não tem imagem"
          example: "https://img.mypcards.com/produtos/12345_pt.jpg"
        img_en:
          type: [string, "null"]
          description: "URL da imagem da carta em inglês. É `null` quando o produto não tem imagem"
          example: "https://img.mypcards.com/produtos/12345_en.jpg"
        link:
          type: string
          description: "URL da página do produto no MYP Cards"
          example: "https://mypcards.com/yugioh/produto/12345/dark-magician"

    ProdutoSimples:
      type: object
      description: "Dados básicos de um produto (sem informações de preço)"
      properties:
        internal_code:
          type: integer
          description: "ID interno do produto no MYP Cards"
          example: 12345
        idmarca:
          type: integer
          description: "ID do jogo/marca"
          example: 0
        name_pt:
          type: [string, "null"]
          description: "Nome da carta em português"
          example: "Mago Negro"
        name_en:
          type: [string, "null"]
          description: "Nome da carta em inglês"
          example: "Dark Magician"
        slugnomeptproduto:
          type: [string, "null"]
          description: "Slug do nome em português"
          example: "mago-negro"
        slugnomeenproduto:
          type: [string, "null"]
          description: "Slug do nome em inglês"
          example: "dark-magician"
        tcg_productId:
          type: [integer, "null"]
          description: "ID do produto no TCGPlayer (quando disponível)"
          example: 86354

    FaixaDeQuantidade:
      type: object
      description: "Intervalo de quantidade que um índice representa"
      properties:
        index:
          type: integer
          description: "Índice da faixa"
          example: 3
        min:
          type: integer
          description: "Menor quantidade da faixa"
          example: 11
        max:
          type: [integer, "null"]
          description: "Maior quantidade da faixa. `null` na última faixa, que não tem limite"
          example: 25

    SemanaDePreco:
      type: object
      description: "Uma semana da série de preço da edição"
      properties:
        week:
          type: string
          format: date
          description: "Domingo da semana"
          example: "2026-10-18"
        set_value:
          type: [number, "null"]
          description: "Valor do set na semana (em BRL). Nas semanas recentes é a soma, por carta, da menor mediana de preço da versão NM sem foil. As semanas antigas, que vêm de um arquivo, usam outra regra. É `null` quando não há dado"
          example: 1840.5
        cards_with_price_range:
          type: [integer, "null"]
          description: "Índice da faixa da quantidade de cartas com preço na semana. Veja `ranges`. É `null` quando a consulta usa `rarity[]`"
          example: 7

    EdicaoPrecosResponse:
      type: object
      description: "Série de preço de uma edição"
      properties:
        edition_id:
          type: integer
          example: 1046
        id_marca:
          type: integer
          example: 1
        edition_code:
          type: [string, "null"]
          example: "DOM"
        edition_pt:
          type: [string, "null"]
          example: "Dominária"
        edition_en:
          type: [string, "null"]
          example: "Dominaria"
        currency:
          type: string
          description: "Moeda dos valores"
          example: "BRL"
        days:
          type: integer
          description: "Janela aplicada, em dias. `0` é a série inteira"
          example: 90
        rarities:
          type: array
          description: "IDs de raridade aplicados no filtro. Vazio quando não há filtro"
          items:
            type: integer
        available_rarities:
          type: array
          description: "Raridades da edição que podem ser usadas no filtro"
          items:
            type: object
            properties:
              id:
                type: integer
                example: 2
              name:
                type: string
                example: "Rare"
        total_cards:
          type: integer
          description: "Quantidade de cartas da edição no catálogo, com o filtro de raridade, se houver. Pode diferir de `total_cards` em `GET /{jogo}/edicoes`, que é o total cadastrado"
          example: 298
        set_value:
          type: [number, "null"]
          description: "Último valor do set da série inteira, não só da janela `days` (em BRL). Com o filtro de raridade, é o valor das cartas filtradas"
          example: 1840.5
        change_week_pct:
          type: [number, "null"]
          description: "Variação do valor do set na última semana, em percentual. Usa só as semanas com preço da fonte atual. As semanas do arquivo antigo não entram"
          example: -1.2
        change_4_weeks_pct:
          type: [number, "null"]
          description: "Variação do valor do set nas últimas quatro semanas, em percentual. Segue a mesma regra de `change_week_pct`"
          example: 3.4
        ranges:
          type: array
          description: "Intervalo de cartas de cada índice de `cards_with_price_range`"
          items:
            $ref: "#/components/schemas/FaixaDeQuantidade"
        weeks:
          type: array
          description: "Semanas da janela, da mais antiga para a mais recente"
          items:
            $ref: "#/components/schemas/SemanaDePreco"

    VersaoDePreco:
      type: object
      description: "Uma versão de um produto: a versão que tem histórico de preço próprio"
      properties:
        foil_id:
          type: integer
          example: 1
        foil_name:
          type: string
          example: "Normal"
        condition:
          type: string
          enum: [NM, SP, MP, HP, DM]
        language_id:
          type: integer
          example: 2
        language_name:
          type: string
          example: "English"
        grader_id:
          type: [integer, "null"]
          description: "ID da graduadora. `null` nas cartas avulsas"
        grade:
          type: [string, "null"]
          description: "Nota da carta graduada. `null` nas cartas avulsas"
          example: "9.5"

    PontoDeHistorico:
      type: object
      description: "Um dia da série de preço"
      properties:
        date:
          type: string
          format: date
          example: "2026-10-20"
        min_price:
          type: [number, "null"]
          description: "Menor preço do dia (em BRL)"
        median:
          type: [number, "null"]
          description: "Mediana dos preços à venda no dia (em BRL)"
        median_sold:
          type: [number, "null"]
          description: "Mediana dos preços de venda no dia (em BRL)"
        available_quantity_range:
          type: [integer, "null"]
          description: "Índice da faixa da quantidade à venda no dia. Veja `quantity_ranges`"
          example: 4

    HistoricoResponse:
      type: object
      description: "Série diária de preço de uma versão de um produto"
      properties:
        internal_code:
          type: integer
          example: 12345
        currency:
          type: string
          example: "BRL"
        days:
          type: integer
          example: 90
        version:
          oneOf:
            - $ref: "#/components/schemas/VersaoDePreco"
            - type: "null"
          description: "A versão da série. É `null` quando não há versão avulsa para escolher: o produto não tem histórico, ou só tem histórico de cartas graduadas. `points` vem vazio"
        versions:
          type: array
          description: "Todas as versões do produto que têm histórico, graduadas incluídas"
          items:
            $ref: "#/components/schemas/VersaoDePreco"
        quantity_ranges:
          type: array
          description: "Intervalo de quantidade de cada índice de `available_quantity_range`"
          items:
            $ref: "#/components/schemas/FaixaDeQuantidade"
        points:
          type: array
          description: "Um ponto por dia, do mais antigo para o mais recente"
          items:
            $ref: "#/components/schemas/PontoDeHistorico"

    Error:
      type: object
      description: "Resposta de erro. O campo `error` é a mensagem em inglês; use `code` no seu código, que é estável"
      required: [error, code, status]
      properties:
        error:
          type: string
          description: "Mensagem de erro"
          example: "card_code not found."
        code:
          type: string
          description: "Código estável do erro"
          enum:
            - invalid_parameter
            - game_not_found
            - card_not_found
            - product_not_found
            - no_product_available
            - edition_not_found
            - version_not_found
            - not_found
            - rate_limited
            - internal_error
            - http_error
          example: "card_not_found"
        status:
          type: integer
          description: "Código HTTP da resposta"
          example: 404
