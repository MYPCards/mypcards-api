name: Validate OpenAPI

on:
  pull_request:
    paths:
      - 'swagger.yaml'
  push:
    branches:
      - main
    paths:
      - 'swagger.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate OpenAPI spec
        run: npx --yes @redocly/cli@latest lint swagger.yaml --format=github-actions
